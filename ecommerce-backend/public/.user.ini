; Picked up automatically by PHP-FPM (most shared hosts + most managed
; Laravel hosting use FPM) — no need to edit a global php.ini by hand.
;
; Set comfortably above config('documents.max_size_kb') (currently 5MB) since
; a seller registration uploads 2 files in one request (ID + permit) and a
; courier uploads 3 (ID + OR/CR + license) — post_max_size must cover the
; whole request, not just one file.
;
; Caveats (see README "Document upload notes"):
; - Only works with PHP-FPM. If your host uses mod_php (Apache) or you're
;   running `php artisan serve` locally, this file is ignored — use the
;   php -d flags in the README instead.
; - Changes can take a few minutes to take effect (cached per FPM's
;   user_ini.cache_ttl, default 300s) — don't panic if it's not instant.

upload_max_filesize = 8M
post_max_size = 20M
